[project]
name = "class-quiz-maker"
version = "1.0.0"
description = "Create classroom quiz videos for YouTube and Shorts (English & Tamil)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Class Quiz Maker contributors" }]
keywords = ["education", "quiz", "youtube", "tamil", "teachers", "pyqt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = [
  "PyQt6>=6.6.0",
  "edge-tts>=6.1.0",
  "gTTS>=2.5.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-qt>=4.2.0"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/class-quiz-maker"
Issues = "https://github.com/YOUR_USERNAME/class-quiz-maker/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
